<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avto evidenca</title>
<style>:root{--b:#0f172a;--p:#2563eb;--l:#dbe3ee}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f1f5f9;color:var(--b)}header{padding:22px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:white;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:16px}.hide{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}textarea{min-height:85px}label{font-size:12px;font-weight:700;color:#475569}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:white}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.jobs{display:grid;gap:12px}.job{border:1px solid var(--l);border-radius:12px;padding:14px}.meta{color:#64748b;font-size:13px}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.photos img{width:90px;height:68px;object-fit:cover;border-radius:8px;cursor:pointer}.msg{padding:10px;border-radius:8px;margin:10px 0;background:#e0f2fe}.error{background:#fee2e2;color:#991b1b}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><header><div class="wrap"><h1>🚗 Avto evidenca</h1><div>Kamere, diagnostika, navigacije in kodiranje</div></div></header><main class="wrap">
<section id="setup" class="card hide"><h2>Potrebna je nastavitev</h2><p>V datoteko <b>config.js</b> vpiši URL in anon ključ projekta Supabase.</p></section>
<section id="auth" class="card"><h2>Prijava</h2><div class="grid"><div><label>E-pošta</label><input id="authEmail" type="email"></div><div><label>Geslo</label><input id="authPassword" type="password"></div></div><div class="actions"><button class="btn primary" id="login">Prijava</button><button class="btn" id="signup">Ustvari račun</button></div><div id="authMsg"></div></section>
<section id="app" class="hide"><div class="card top"><div><b id="who"></b><div class="meta">Podatki so shranjeni v spletni bazi.</div></div><button class="btn" id="logout">Odjava</button></div>
<section class="card"><h2 id="formTitle">Nov zapis</h2><form id="form"><input id="id" type="hidden"><div class="grid">
<div><label>Datum</label><input id="job_date" type="date" required></div><div><label>Status</label><select id="status"><option>Zaključeno</option><option>V teku</option><option>Naročeno</option><option>Čaka na material</option></select></div>
<div><label>Stranka</label><input id="customer" required></div><div><label>Telefon</label><input id="phone"></div><div><label>E-pošta</label><input id="email" type="email"></div><div><label>Vozilo</label><input id="vehicle" required></div><div><label>Registrska</label><input id="plate"></div><div><label>VIN</label><input id="vin" maxlength="17"></div>
<div class="full"><label>Storitev</label><select id="service" required><option>Montaža kamere</option><option>Diagnostika</option><option>Montaža navigacije</option><option>Kodiranje / aktivacija</option><option>Popravilo elektronike</option><option>Drugo</option></select></div>
<div class="full"><label>Opravljeno delo</label><textarea id="work_done" required></textarea></div><div class="full"><label>Deli in material</label><textarea id="parts"></textarea></div><div><label>Znesek (€)</label><input id="amount" type="number" min="0" step=".01"></div><div><label>Plačilo</label><select id="payment"><option>Ni določeno</option><option>Gotovina</option><option>Nakazilo</option><option>Kartica</option><option>Neplačano</option></select></div><div class="full"><label>Opombe</label><textarea id="notes"></textarea></div><div class="full"><label>Slike</label><input id="photos" type="file" accept="image/*" multiple></div></div><div class="actions"><button class="btn primary">Shrani</button><button class="btn" type="button" id="clear">Počisti</button></div><div id="formMsg"></div></form></section>
<section class="card"><div class="top"><h2>Zapisi</h2><button class="btn" id="export">Izvozi JSON</button></div><input id="search" placeholder="Išči po stranki, telefonu, vozilu, VIN-u ..."><div id="jobs" class="jobs" style="margin-top:14px"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.APP_CONFIG||{},configured=C.SUPABASE_URL&&!C.SUPABASE_URL.startsWith('VSTAVI_')&&C.SUPABASE_ANON_KEY&&!C.SUPABASE_ANON_KEY.startsWith('VSTAVI_');
if(!configured){document.querySelector('#setup').classList.remove('hide');document.querySelector('#auth').classList.add('hide');throw new Error('Manjka konfiguracija')}
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),$=s=>document.querySelector(s);let user,jobs=[];
const fields=['job_date','status','customer','phone','email','vehicle','plate','vin','service','work_done','parts','amount','payment','notes'];
function msg(el,t,e=false){el.innerHTML=t?`<div class="msg ${e?'error':''}">${t}</div>`:''}
async function session(){const {data}=await sb.auth.getSession();user=data.session?.user;$('#auth').classList.toggle('hide',!!user);$('#app').classList.toggle('hide',!user);if(user){$('#who').textContent=user.email;load()}}
$('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#authEmail').value,password:$('#authPassword').value});msg($('#authMsg'),error?error.message:'Prijava uspešna',!!error);session()};
$('#signup').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('#authEmail').value,password:$('#authPassword').value});msg($('#authMsg'),error?error.message:'Račun ustvarjen. Če je zahtevano, potrdi e-pošto.',!!error)};
$('#logout').onclick=async()=>{await sb.auth.signOut();session()};
async function load(){const {data,error}=await sb.from('jobs').select('*,job_photos(*)').order('job_date',{ascending:false});if(error)return msg($('#formMsg'),error.message,true);jobs=data||[];render()}
function render(){let q=$('#search').value.toLowerCase();let a=jobs.filter(j=>Object.values(j).join(' ').toLowerCase().includes(q));$('#jobs').innerHTML=a.length?a.map(j=>`<article class="job"><div class="top"><div><b>${esc(j.customer)} · ${esc(j.vehicle)}</b><div class="meta">${j.job_date} · ${esc(j.service)} · ${Number(j.amount||0).toLocaleString('sl-SI',{style:'currency',currency:'EUR'})}</div></div><div><button class="btn" onclick="editJob('${j.id}')">Uredi</button> <button class="btn danger" onclick="delJob('${j.id}')">Izbriši</button></div></div><p>${esc(j.work_done)}</p><div class="meta">${esc(j.phone||'')} ${esc(j.plate||'')} ${esc(j.vin||'')}</div><div class="photos" id="p${j.id}"></div></article>`).join(''):'Ni zapisov.';a.forEach(photoUrls)}
async function photoUrls(j){let el=$('#p'+j.id);for(const p of j.job_photos||[]){const {data}=await sb.storage.from('job-photos').createSignedUrl(p.storage_path,3600);if(data?.signedUrl)el.insertAdjacentHTML('beforeend',`<img src="${data.signedUrl}" onclick="window.open(this.src)">`)}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#form').onsubmit=async e=>{e.preventDefault();msg($('#formMsg'),'Shranjujem ...');let row={user_id:user.id};fields.forEach(f=>row[f]=$('#'+f).value);row.amount=Number(row.amount||0);let id=$('#id').value,res=id?await sb.from('jobs').update(row).eq('id',id).select().single():await sb.from('jobs').insert(row).select().single();if(res.error)return msg($('#formMsg'),res.error.message,true);id=res.data.id;for(const f of $('#photos').files){let safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user.id}/${id}/${crypto.randomUUID()}-${safe}`;let up=await sb.storage.from('job-photos').upload(path,f);if(up.error)return msg($('#formMsg'),up.error.message,true);await sb.from('job_photos').insert({user_id:user.id,job_id:id,storage_path:path,file_name:f.name})}clearForm();msg($('#formMsg'),'Shranjeno.');load()};
function editJob(id){let j=jobs.find(x=>x.id===id);$('#id').value=id;fields.forEach(f=>$('#'+f).value=j[f]??'');$('#formTitle').textContent='Uredi zapis';scrollTo({top:0,behavior:'smooth'})}
async function delJob(id){if(!confirm('Izbrišem zapis in njegove slike?'))return;let j=jobs.find(x=>x.id===id),paths=(j.job_photos||[]).map(p=>p.storage_path);if(paths.length)await sb.storage.from('job-photos').remove(paths);let {error}=await sb.from('jobs').delete().eq('id',id);if(error)alert(error.message);load()}
function clearForm(){$('#form').reset();$('#id').value='';$('#job_date').value=new Date().toISOString().slice(0,10);$('#formTitle').textContent='Nov zapis'}$('#clear').onclick=clearForm;$('#search').oninput=render;
$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}));a.download='avto-evidenca-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('#job_date').value=new Date().toISOString().slice(0,10);sb.auth.onAuthStateChange(()=>session());session();
</script></body></html>
